<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="竹家去哪兒：新竹古蹟實境解謎 × 親子剛需地圖 × AI 學習歷程 互動原型">
<style>:root{color-scheme:light dark}[hidden]{display:none!important}img{max-width:100%}</style>
<title>竹家去哪兒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
/* Layout: presenter stage — giant vertical chapter word | live phone | tour card that drives the phone. Bamboo green + seal vermilion, Kai display. */
:root{
  --paper:#eef1ec; --surface:#ffffff; --ink:#15201b; --muted:#5d6a63; --line:#d9e0d9;
  --bamboo:#1e5a44; --bamboo-2:#2f7c5e; --leaf:#e0ebe3; --seal:#c93b26; --seal-soft:#f8e2dc;
  --gold:#a8790f; --m-land:#e6e2d6; --m-block:#efece3; --m-old:#f3e4cf; --m-road:#ffffff; --m-case:#d3ccbd; --m-rail:#5d5a55; --m-ripple:#e8f4f6; --m-tree:#9cc49a; --gold-soft:#f6ecd2; --water:#a9cdd6; --block:#e4e8e2; --park:#cfe1cf;
  --f-kai:"LXGW WenKai TC","Kaiti TC","BiauKai",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --shadow:0 30px 60px -30px rgba(21,32,27,.45);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1512; --surface:#16201b; --ink:#e7eee9; --muted:#97a69e; --line:#27342d;
  --bamboo:#79c9a2; --bamboo-2:#5fb38c; --leaf:#1b2e25; --seal:#f07259; --seal-soft:#3a1d17;
  --gold:#e0b64e; --m-land:#1a211d; --m-block:#202923; --m-old:#2b2a22; --m-road:#3a4640; --m-case:#121815; --m-rail:#8a948e; --m-ripple:#3e7684; --m-tree:#2f5a3e; --gold-soft:#33290f; --water:#24505c; --block:#1c2621; --park:#1f3a2a;
  --shadow:0 30px 60px -30px rgba(0,0,0,.8); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0e1512; --surface:#16201b; --ink:#e7eee9; --muted:#97a69e; --line:#27342d;
  --bamboo:#79c9a2; --bamboo-2:#5fb38c; --leaf:#1b2e25; --seal:#f07259; --seal-soft:#3a1d17;
  --gold:#e0b64e; --m-land:#1a211d; --m-block:#202923; --m-old:#2b2a22; --m-road:#3a4640; --m-case:#121815; --m-rail:#8a948e; --m-ripple:#3e7684; --m-tree:#2f5a3e; --gold-soft:#33290f; --water:#24505c; --block:#1c2621; --park:#1f3a2a;
  --shadow:0 30px 60px -30px rgba(0,0,0,.8); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.kai{font-family:var(--f-kai)}

/* ===== stage ===== */
.stage-wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 392px minmax(0,1fr);gap:40px;align-items:center;min-height:calc(100vh - 40px)}
.chapter{display:flex;gap:18px;justify-content:flex-end;align-items:flex-start;height:100%;padding-top:4vh}
.chapter .big{writing-mode:vertical-rl;font-family:var(--f-kai);font-weight:700;font-size:clamp(64px,8vw,112px);line-height:1;color:var(--bamboo);letter-spacing:.06em;transition:color .4s}
.chapter .side{writing-mode:vertical-rl;font-size:13px;color:var(--muted);letter-spacing:.3em;display:flex;gap:14px}
.chapter .side b{color:var(--seal);font-weight:700}
.brandseal{width:46px;height:46px;border:2px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-family:var(--f-kai);font-weight:700;font-size:15px;line-height:1.05;text-align:center;border-radius:4px;transform:rotate(-4deg)}

.coach{display:flex;flex-direction:column;gap:18px;max-width:360px;min-width:0}
.coach .brand{display:flex;align-items:center;gap:12px}
.coach .brand h1{font-family:var(--f-kai);font-size:26px;margin:0;line-height:1.2}
.coach .brand p{margin:0;font-size:12px;color:var(--muted)}
.chapbar{display:grid;grid-template-columns:4fr 3fr 3fr;gap:6px}
.chapbar div{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--muted);letter-spacing:.12em}
.chapbar .dots{display:flex;gap:4px}
.chapbar .dots button{flex:1;height:5px;border:0;padding:0;border-radius:3px;background:var(--line)}
.chapbar .dots button.on{background:var(--bamboo)}
.chapbar .dots button.cur{background:var(--seal)}
.chapbar div.cur{color:var(--ink);font-weight:700}
.step{display:grid;gap:10px}
.step .no{font-family:var(--f-num);font-weight:800;font-size:13px;color:var(--seal);letter-spacing:.08em}
.step h2{font-family:var(--f-kai);font-size:30px;line-height:1.25;margin:0;text-wrap:balance}
.step p{margin:0;font-size:15px;color:var(--muted);line-height:1.75}
.metric{display:flex;align-items:baseline;gap:10px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.metric .v{white-space:nowrap;font-family:var(--f-num);font-weight:800;font-size:34px;line-height:1;color:var(--bamboo);font-variant-numeric:tabular-nums}
.metric .l{font-size:12.5px;color:var(--muted);line-height:1.4}
.metric .live{margin-left:auto;font-size:12px;color:var(--seal);white-space:nowrap;font-weight:500}
.nav{display:flex;gap:8px;align-items:center}
.nav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:700}
.nav .next{background:var(--ink);color:var(--paper);border-color:var(--ink);flex:1}
.nav .keys{font-size:11.5px;color:var(--muted);margin-left:4px}
.disclaim{font-size:11.5px;color:var(--muted);line-height:1.6}

/* ===== phone ===== */
.phone{width:392px;height:min(820px,calc(100vh - 40px));border-radius:48px;padding:9px;background:#0c100e;box-shadow:var(--shadow),inset 0 0 0 1.5px #2a332e}
.screen{position:relative;height:100%;border-radius:40px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.topbar{position:absolute;left:0;right:0;top:0;z-index:5;padding:14px 16px 0;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.topbar>*{pointer-events:auto}
.topbar{transition:background .2s}
.topbar.solid{background:linear-gradient(var(--paper) 72%,transparent);padding-bottom:14px}
.qmode .topbar.solid{background:linear-gradient(#111613 72%,transparent)}
.pill{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:7px 12px;font-size:12.5px;box-shadow:0 6px 18px -8px rgba(0,0,0,.3)}
.pill svg{width:15px;height:15px;stroke:var(--seal);fill:none;stroke-width:2}
.who{border:0;font-weight:700}
.who i{font-style:normal;color:var(--bamboo)}
.view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.pad{padding:16px 16px 110px;display:flex;flex-direction:column;gap:16px}
.tabbar{position:absolute;left:14px;right:14px;bottom:14px;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border-radius:22px;padding:6px;box-shadow:0 14px 30px -12px rgba(0,0,0,.35)}
.tabbar button{border:0;background:transparent;border-radius:16px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted)}
.tabbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{background:var(--bamboo);color:var(--surface);font-weight:700}
.qmode .tabbar{background:#1c2420}
.qmode .tabbar button{color:#8d9a93}
.qmode .tabbar button[aria-current="page"]{background:#e8c27a;color:#1a1410}
.qmode .pill{background:#1c2420;color:#e9e3d6}

/* spotlight */
.spot{position:relative;z-index:3;box-shadow:0 0 0 3px var(--seal),0 0 0 9px color-mix(in srgb,var(--seal) 22%,transparent)!important;border-radius:18px;animation:spot 1.6s ease-in-out infinite}
@keyframes spot{50%{box-shadow:0 0 0 3px var(--seal),0 0 0 14px color-mix(in srgb,var(--seal) 8%,transparent)}}
@media (prefers-reduced-motion:reduce){.spot{animation:none}}

/* welcome */
.welcome{min-height:100%;padding:86px 22px 120px;display:flex;flex-direction:column;gap:22px;background:
  radial-gradient(circle at 110% -10%,var(--leaf) 0 42%,transparent 42.5%),var(--paper)}
.welcome h2{font-family:var(--f-kai);font-size:44px;line-height:1.15;margin:0}
.welcome h2 em{font-style:normal;color:var(--seal)}
.welcome p{margin:0;color:var(--muted);font-size:14px}
.persona{display:grid;gap:12px;border-radius:22px}
.pcard{display:grid;grid-template-columns:minmax(0,1fr) 84px;align-items:center;gap:10px;text-align:left;border:0;border-radius:22px;padding:18px;background:var(--surface);box-shadow:0 10px 26px -18px rgba(0,0,0,.4)}
.pcard b{font-family:var(--f-kai);font-size:22px;display:block}
.pcard span{font-size:12.5px;color:var(--muted);display:block;line-height:1.5}
.pcard svg{width:84px;height:84px}
.pcard.on{background:var(--bamboo);color:var(--surface)}
.pcard.on span{color:color-mix(in srgb,var(--surface) 75%,transparent)}
.stat{display:flex;gap:12px;align-items:baseline;border-top:1px dashed var(--line);padding-top:14px}
.stat b{font-family:var(--f-num);font-size:30px;font-weight:800;color:var(--bamboo)}
.stat span{font-size:12.5px;color:var(--muted)}

/* explore */
.mapbox{position:relative;height:300px;background:var(--m-land)}
.mapbox svg{display:block;width:100%;height:100%}
.pin{cursor:pointer;transition:opacity .3s}
.pin.dim{opacity:.22}
.pin text{font-family:var(--f-kai);font-weight:700;font-size:12px}
.pin .pn{font-family:var(--f-body);font-size:8.5px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.pin .pl{font-family:var(--f-body);font-size:8.5px;font-weight:700;fill:var(--ink)}
.rl{font-family:var(--f-body);font-size:7.5px;fill:var(--muted);letter-spacing:.2em;paint-order:stroke;stroke:var(--m-road);stroke-width:2.5px}
.lm{font-family:var(--f-body);font-size:8px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:2.5px}
.area{font-family:var(--f-kai);font-size:12px;font-weight:700;fill:var(--muted);letter-spacing:.3em;opacity:.8}
.sheet-up{position:relative;margin-top:-26px;background:var(--paper);border-radius:26px 26px 0 0;z-index:2}
.sheet-up::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 0}
.h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.h3 h3{font-family:var(--f-kai);font-size:20px;margin:0}
.h3 small{font-size:12px;color:var(--muted)}
.needs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;border-radius:18px}
.need{border:0;background:var(--surface);border-radius:16px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;line-height:1.25;color:var(--muted)}
.need svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.need[aria-pressed="true"]{background:var(--bamboo);color:var(--surface);font-weight:700}
.ages{display:flex;gap:6px}
.age{flex:1;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 0;font-size:12.5px;color:var(--muted)}
.age[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}
.cta{border:0;border-radius:18px;padding:15px;background:var(--seal);color:#fff;font-weight:700;font-size:15px;display:flex;justify-content:center;align-items:center;gap:8px}
.cta svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;background:var(--ink);color:var(--paper);border-radius:20px;padding:16px;cursor:pointer;border:0;text-align:left;width:100%}
.result .sec{grid-row:span 2;font-family:var(--f-num);font-weight:800;font-size:30px;line-height:1;color:#ffb39f;font-variant-numeric:tabular-nums}
.result .sec small{display:block;font-size:10.5px;font-weight:500;color:color-mix(in srgb,var(--paper) 60%,transparent);letter-spacing:.08em;margin-top:4px}
.result b{font-family:var(--f-kai);font-size:19px}
.result span{font-size:12px;color:color-mix(in srgb,var(--paper) 70%,transparent)}
.recs{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:18px}
.recs::-webkit-scrollbar{display:none}
.vcard{flex:0 0 232px;scroll-snap-align:start;border:0;padding:0;text-align:left;background:var(--surface);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.vcard .art{height:118px;position:relative;display:flex;align-items:flex-end;padding:10px 12px;color:#fff;overflow:hidden}
.art>svg,.hero>svg{position:absolute;inset:0;width:100%;height:100%}
.art::after,.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,14,12,.62))}
.vcard .art b{font-family:var(--f-kai);font-size:18px;position:relative;z-index:1;line-height:1.25;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.vcard .art .badge{position:absolute;left:10px;top:10px;z-index:1;font-size:10.5px;font-weight:700;background:var(--seal);color:#fff;border-radius:6px;padding:1px 7px}
.hero{position:relative;height:190px;margin:-22px -20px 0;border-radius:28px 28px 0 0;overflow:hidden;display:flex;align-items:flex-end;padding:16px 20px;color:#fff}
.hero h2{position:relative;z-index:1;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.hero h2 small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;opacity:.85}
.vcard .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--leaf);color:var(--bamboo);font-weight:500}
.tag.bad{background:var(--gold-soft);color:var(--gold)}
.tag.q{background:var(--seal-soft);color:var(--seal)}
.dist{font-family:var(--f-num);font-weight:800;color:var(--ink);font-size:13px}

/* overlay sheet */
.overlay{position:absolute;inset:0;z-index:20;background:rgba(8,12,10,.5);display:flex;align-items:flex-end}
.overlay.center{align-items:center;padding:20px}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--paper);border-radius:28px 28px 0 0;padding:22px 20px 26px;display:flex;flex-direction:column;gap:14px}
.overlay.center .sheet{border-radius:26px}
.sheet h2{font-family:var(--f-kai);font-size:26px;margin:0;line-height:1.2}
.frow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ev{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;font-size:13px;align-items:baseline}
.ev small{color:var(--seal);font-weight:700;font-size:11.5px}
.btn{border:0;border-radius:16px;padding:13px;font-weight:700;background:var(--bamboo);color:var(--surface);width:100%}
.btn.red{background:var(--seal);color:#fff}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px}
.toast{position:absolute;left:20px;right:20px;bottom:96px;z-index:40;background:var(--ink);color:var(--paper);border-radius:16px;padding:12px 14px;font-size:13px}

/* ===== quest (deliberately dark, night-tour look) ===== */
.quest{--q-bg:#111613;--q-card:#1b231f;--q-ink:#ede6d8;--q-mute:#9aa49d;--q-gold:#e8c27a;--q-seal:#ef6a52;--q-jade:#7fd1b0;
  background:var(--q-bg);color:var(--q-ink);min-height:100%;padding:70px 16px 110px;display:flex;flex-direction:column;gap:14px}
.route{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;gap:6px}
.route .n{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--q-mute)}
.route .d{width:30px;height:30px;border-radius:8px;border:1.5px solid #3a453f;display:grid;place-items:center;font-family:var(--f-kai);font-weight:700;font-size:15px}
.route .n.now .d{border-color:var(--q-gold);color:var(--q-gold)}
.route .n.now{color:var(--q-gold)}
.route .n.done .d{background:var(--q-seal);border-color:var(--q-seal);color:#fff;transform:rotate(-6deg)}
.route .ln{height:1.5px;background:repeating-linear-gradient(90deg,#3a453f 0 5px,transparent 5px 9px)}
.qtitle{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.qtitle h2{font-family:var(--f-kai);font-size:28px;margin:0;line-height:1.15}
.qtitle h2 small{display:block;font-size:12px;color:var(--q-gold);font-family:var(--f-body);letter-spacing:.2em;font-weight:500}
.timer{font-family:var(--f-num);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;color:var(--q-mute)}
.qintro{margin:0;font-size:13px;color:var(--q-mute);line-height:1.7}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#000}
.stage svg{display:block;width:100%;height:auto}
.stage.vr{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:14px 6px}
.stage.vr .eye{border-radius:48% 48% 42% 42%/52% 52% 40% 40%;overflow:hidden}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;z-index:2;pointer-events:none}
.hud>*{pointer-events:auto}
.hud span,.hud button{border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;backdrop-filter:blur(6px)}
.hud button{background:var(--q-gold);color:#1a1410}
.hot{cursor:pointer}
.hot .ring{fill:none;stroke:#ffd88a;stroke-width:2;animation:ring 1.8s ease-out infinite;transform-origin:center;transform-box:fill-box}
.hot .core{fill:#ffd88a}
.hot.got .ring{stroke:var(--q-jade);animation:none}
.hot.got .core{fill:var(--q-jade)}
@keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.hot .ring{animation:none}}
.clues{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.clue{background:var(--q-card);border-radius:14px;padding:10px;font-size:11.5px;line-height:1.5;color:var(--q-mute);display:flex;flex-direction:column;gap:4px;min-height:96px}
.clue .k{font-family:var(--f-kai);font-size:16px;font-weight:700;color:#4b5650}
.clue.got{color:var(--q-ink);background:#20302a}
.clue.got .k{color:var(--q-jade)}
.aihint{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;background:linear-gradient(135deg,#2b2417,#1b231f);border:1px solid #4a3d22;border-radius:18px;padding:12px;font-size:13px;line-height:1.6}
.aihint .av{width:34px;height:34px;border-radius:8px;background:var(--q-gold);color:#1a1410;display:grid;place-items:center;font-family:var(--f-kai);font-weight:700;font-size:16px}
.aihint b{color:var(--q-gold)}
.lock{background:var(--q-card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.lock .ask{font-family:var(--f-kai);font-size:17px}

const matchAge=v=>[...S.ages].some(a=>v.ages.includes(a));
function score(v){let s=0;S.needs.forEach(n=>{if(v.f[n])s+=3});S.ages.forEach(a=>{if(v.ages.includes(a))s+=2});if(S.persona==='student'&&v.quest!=null)s+=4;return s-dist(v)/400;}
function reason(v){
  const hit=[...S.needs].filter(n=>v.f[n]).map(n=>NEEDS[n]);
  return (hit.length?'有'+hit.join('、')+'。':'')+v.why;
}
function findNearest(){
  const t0=performance.now();
  const list=VENUES.filter(v=>matchNeeds(v)&&matchAge(v)).sort((a,b)=>dist(a)-dist(b));
  S.searchMs=performance.now()-t0+620; // includes simulated GPS fix
  S.found=list[0]||'none';
}
function solveCurrent(){
  const q=S.q,i=q.level;if(q.done[i])return;
  q.found[i]=QUESTS[i].clues.map(c=>c[0]);
  q.done[i]=true;S.coupons++;if(i>0)S.navigated=true;
  q.err='';q.pick=[];q.order=[];q.hintN=0;q.autoHint=false;
  S.sheet={solved:i};
}

function pushAnswer(text){

  {ch:2,t:'集章換證書與在地優惠',b:'三枚印章集滿得到數位證書，通關優惠券可以到在地書店、親子餐廳使用，把人潮帶進街區。',m:['25%','特約店家優惠券兌換率'],live:()=>'本次 '+S.coupons+' 張券',go:()=>{S.q.done.forEach((d,k)=>{if(!d){S.q.done[k]=true;S.q.found[k]=QUESTS[k].clues.map(c=>c[0]);S.coupons++;}});S.navigated=true;S.tab='diary';S.feedTab='mine'},spot:'.book'},
  {ch:2,t:'上傳照片，分享到平台',b:'選照片、標地點、寫下孩子說的話，一鍵發布。照片自動帶上場館定位，也存成學習歷程的素材。',m:['1 鍵','發布並同步為學習歷程素材'],go:()=>{S.tab='diary';S.feedTab='feed';S.draft={img:null,pick:'art',venue:'art',text:'弟弟說美術館的拱窗像城堡，還在兒童展區畫了一張他自己的新竹地圖。',tags:['#親子共學','#雨天備案']};S.sheet={compose:true}},spot:'.sheet'},
  {ch:2,t:'看看其他家庭的足跡',b:'家長分享設施實況，學生分享解謎心得，店家推出通關優惠。可以按讚、留言，點頭像只看某個人的分享。',m:['8 則','示範動態（假資料）'],go:()=>{S.tab='diary';S.feedTab='feed';S.filter='all';S.whoFilter=null},spot:'.feed'},
  {ch:2,t:'AI 採訪，引導孩子反思',b:'AI 只負責提問與整理，內容來自孩子自己的口述。四個問題，從印象、困難、連結到延伸探究。',m:['70%','學生對生成內容的滿意度'],go:()=>{S.tab='portfolio';startChat();while(S.qi<2)pushAnswer(QUESTIONS[S.qi].sample)},spot:'.chat'},
  {ch:2,t:'一鍵變成學習歷程',b:'依 108 課綱格式整理動機、歷程、反思與核心素養，保留孩子的原話，可直接放進學習歷程檔案。',m:['3 處','第一階段示範場域，5–10 組家庭試用'],go:()=>{S.tab='portfolio';startChat();while(S.qi<QUESTIONS.length)pushAnswer(QUESTIONS[S.qi].sample);S.doc=true},spot:'.doc'}
];
const CH=[['出遊前','壹'],['體驗中','貳'],['體驗後','參']];
let step=0;
function goStep(k){
  step=Math.max(0,Math.min(TOUR.length-1,k));
  const T=TOUR[step];
  if(!['.sheet','.solved'].includes(T.spot))S.sheet=null;
  T.go();S.spot=T.spot;render(true);paintCoach();
}
function paintCoach(){
  const T=TOUR[step];
  $('#chapBig').textContent=CH[T.ch][0];$('#chapNo').textContent=CH[T.ch][1];
  $('#chapbar').innerHTML=CH.map((c,ci)=>`<div class="${ci===T.ch?'cur':''}">${c[0]}<span class="dots">${TOUR.map((x,k)=>x.ch===ci?`<button class="${k===step?'cur':k<step?'on':''}" data-step="${k}" aria-label="第 ${k+1} 步"></button>`:'').join('')}</span></div>`).join('');
  $('#stepNo').textContent=String(step+1).padStart(2,'0')+' / '+String(TOUR.length).padStart(2,'0')+'　'+CH[T.ch][0];
  $('#stepTitle').textContent=T.t;$('#stepBody').textContent=T.b;
  const live=T.live?T.live():'';
  $('#metric').innerHTML=`<span class="v">${T.m[0]}</span><span class="l">${esc(T.m[1])}</span>${live?`<span class="live">${esc(live)}</span>`:''}`;
  $('#prev').disabled=step===0;$('#next').textContent=step===TOUR.length-1?'回到開頭':'下一步';
}
$('#prev').onclick=()=>goStep(step-1);
$('#next').onclick=()=>goStep(step===TOUR.length-1?0:step+1);
$('#chapbar').addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(b)goStep(+b.dataset.step);});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')goStep(step+1);if(e.key==='ArrowLeft')goStep(step-1);});

/* ---------- render ---------- */
function render(scrollToSpot){
  const v=$('#view'),keep=v.scrollTop;
  $('#screen').classList.toggle('qmode',S.tab==='quest');
  $('#who').innerHTML=S.persona==='parent'?'<i>●</i> 家長模式':'<i>●</i> 學生模式';
  document.querySelectorAll('.tabbar [data-tab]').forEach(b=>b.dataset.tab===S.tab?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  let html=({home:homeView,explore:exploreView,quest:questView,diary:diaryView,portfolio:portfolioView})[S.tab]();
  if(S.sheet&&S.sheet.venue)html+=venueSheet(VENUES.find(x=>x.id===S.sheet.venue));
  if(S.sheet&&S.sheet.solved!=null)html+=solvedSheet(S.sheet.solved);
  if(S.sheet&&S.sheet.compose)html+=composeSheet();
  if(S.toast)html+=`<div class="toast" role="status">${esc(S.toast)}</div>`;
  v.innerHTML=html;
  const sp=S.spot&&v.querySelector(S.spot);
  if(sp){sp.classList.add('spot');
    if(scrollToSpot&&!sp.closest('.overlay')){v.scrollTop=0;const r=sp.getBoundingClientRect(),vr=v.getBoundingClientRect();v.scrollTop=Math.max(0,r.top-vr.top-90);}
    else if(!scrollToSpot)v.scrollTop=keep;}
  else v.scrollTop=scrollToSpot?0:keep;
  solidTop();
}
function solidTop(){$('.topbar').classList.toggle('solid',$('#view').scrollTop>8);}
$('#view').addEventListener('scroll',solidTop,{passive:true});
let toastT;function toast(m){S.toast=m;render();clearTimeout(toastT);toastT=setTimeout(()=>{S.toast='';render();},2600);}
function userAct(){S.spot=null;} // free interaction clears the spotlight

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){userAct();S.sheet=null;S.tab=g.dataset.go;render(true);return;}
  const t=e.target.closest('.tabbar [data-tab]');if(t){userAct();S.sheet=null;S.tab=t.dataset.tab;render(true);return;}
  if(e.target.closest('#who')){userAct();setPersona(S.persona==='parent'?'student':'parent');render();}
});
$('#view').addEventListener('click',e=>{
  const t=e.target,c=s=>t.closest(s);let el;
  if(el=c('[data-persona]')){userAct();setPersona(el.dataset.persona);return render();}
  if(c('#startgo')){userAct();S.tab='explore';return render(true);}
  if(el=c('[data-need]')){userAct();const k=el.dataset.need;S.needs.has(k)?S.needs.delete(k):S.needs.add(k);S.found=null;return render();}
  if(el=c('[data-age]')){userAct();const k=el.dataset.age;if(S.ages.has(k)&&S.ages.size>1)S.ages.delete(k);else S.ages.add(k);S.found=null;return render();}
  if(c('#nearest')){userAct();findNearest();return render();}
  if(el=c('[data-venue]')){userAct();S.sheet={venue:el.dataset.venue};return render();}
  if(t.matches('[data-close]')){if(S.uploading!=null)return;userAct();S.sheet=null;return render();}
  if(c('#openrep')){S.sheet.report=true;return render();}
  if(el=c('[data-rep]')){userAct();const v=VENUES.find(x=>x.id===S.sheet.venue);Object.keys(v.broken||{}).forEach(n=>S.reported[v.id+n]=1);S.sheet=null;return toast('已回報「'+el.dataset.rep+'」，24 小時內更新地圖標註。');}
  if(el=c('[data-startq]')){userAct();const k=+el.dataset.startq;if(!S.q.done[k]){S.q.level=k;S.q.start=Date.now();S.q.hintN=0;S.q.autoHint=false;}S.sheet=null;S.tab='quest';return render(true);}
  if(el=c('[data-clue]')){userAct();const i=S.q.level,id=el.dataset.clue;if(!S.q.found[i].includes(id))S.q.found[i].push(id);S.q.err='';return render();}
  if(c('#vrbtn')){userAct();S.q.vr=!S.q.vr;return render();}
  if(c('#hint')){userAct();S.q.hintN=Math.min(S.q.hintN+1,QUESTS[S.q.level].hints.length);S.q.autoHint=false;return render();}
  if(el=c('[data-pick]')){const o=el.dataset.pick,p=S.q.pick;p.includes(o)?p.splice(p.indexOf(o),1):p.push(o);return render();}
  if(el=c('[data-ord]')){if(S.q.order.length<3)S.q.order.push(el.dataset.ord);return render();}
  if(c('[data-ordclr]')){S.q.order=[];return render();}
  if(c('#unlock')){userAct();
    const q=S.q,L=QUESTS[q.level].lock;let ok=false;
    if(L.type==='code')ok=$('#code').value.trim()===L.answer;
    if(L.type==='multi')ok=q.pick.length===2&&L.answer.every(a=>q.pick.includes(a));
    if(L.type==='order')ok=q.order.join('')===L.answer;
    if(ok)solveCurrent();else q.err=q.found[q.level].length<3?'還有線索沒找到，先調查場景。':'密碼不對，再想想，或請 AI 提示。';
    return render();}
  if(c('#skipq')){userAct();solveCurrent();return render();}
  if(c('[data-next]')){userAct();const i=S.sheet.solved;S.sheet=null;
    if(i<2){S.q.level=i+1;S.q.start=Date.now();S.navigated=true;render(true);toast('已規劃路線：'+VENUES.find(v=>v.id===QUESTS[i+1].venue).transit);}
    else{S.tab='diary';render(true);}return;}
  if(c('#qreset')){userAct();S.q=freshQ();S.coupons=0;S.navigated=false;return render(true);}
  if(el=c('[data-ftab]')){userAct();S.feedTab=el.dataset.ftab;return render(true);}
  if(el=c('[data-filter]')){userAct();S.filter=el.dataset.filter;return render();}
  if(el=c('[data-user]')){userAct();S.whoFilter=el.dataset.user||null;S.feedTab='feed';return render(true);}
  if(el=c('[data-like]')){const id=+el.dataset.like;S.liked.has(id)?S.liked.delete(id):S.liked.add(id);return render();}
  if(el=c('[data-cm]')){const id=+el.dataset.cm;S.openCm.has(id)?S.openCm.delete(id):S.openCm.add(id);render();const i=$('#cm'+id);if(i)i.focus({preventScroll:true});return;}
  if(el=c('[data-seefeed]')){userAct();S.sheet=null;S.tab='diary';S.feedTab='feed';S.whoFilter=null;S.filter=el.dataset.seefeed;return render(true);}
  if(c('[data-compose]')){userAct();S.sheet={compose:true};return render();}
  if(el=c('[data-pickimg]')){S.draft.img=null;S.draft.pick=el.dataset.pickimg;S.draft.venue=el.dataset.pickimg;return render();}
  if(el=c('[data-dvenue]')){S.draft.venue=el.dataset.dvenue;return render();}
  if(el=c('[data-dtag]')){const t=el.dataset.dtag,T=S.draft.tags;T.includes(t)?T.splice(T.indexOf(t),1):T.push(t);return render();}
  if(c('#publish')){
    const d=S.draft;if(!d.text.trim()&&!d.img&&!d.pick)return toast('選一張照片或寫一句話再發布。');
    S.uploading=0;render();
    const iv=setInterval(()=>{S.uploading=Math.min(100,S.uploading+9);
      if(S.uploading<100)return render();
      clearInterval(iv);
      const post={id:Date.now(),who:'我',venue:d.venue,illo:d.img?null:d.pick,mood:1,time:'剛剛',text:d.text.trim()||'今天的藝文時光。',tags:d.tags.slice(),likes:0,comments:[],img:d.img,fresh:true};
      S.feed.unshift(post);S.uploading=null;S.sheet=null;S.feedTab='feed';S.filter='all';S.whoFilter=null;
      S.draft={img:null,pick:'art',venue:'art',text:'',tags:['#親子共學']};
      render();$('#view').scrollTop=0;toast('已發布到「大家的足跡」，並同步為學習歷程素材。');
      setTimeout(()=>{post.fresh=false;post.likes+=3;post.comments.push(['小安媽媽','好可愛！我們週末也要去']);if(S.tab==='diary')render();},2600);
    },110);
    return;}
  if(c('#sample')){userAct();pushAnswer(QUESTIONS[S.qi].sample);render();$('#view').scrollTop=1e6;return;}
  if(c('#gendoc')){S.doc=true;S.spot='.doc';return render(true);}
  if(c('#rechat')){userAct();S.chat=[];S.qi=0;S.doc=false;return render(true);}
  if(c('#copydoc')){const d=docData();
    const txt=[d.title,...d.meta.map(m=>m.join('：')),'','【動機】',d.motive,'','【歷程】',d.process,'','【我的觀察】',...d.quotes.map(q=>'「'+q+'」'),'','【反思】',d.reflect,'','【延伸探究】',d.next,'','【對應核心素養】',d.comp.join('、')].join('\n');
    navigator.clipboard.writeText(txt).then(()=>toast('已複製學習歷程全文。')).catch(()=>{const r=document.createRange();r.selectNodeContents($('.doc'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('已選取全文，請按複製。');});}
});
$('#view').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-venue],[data-clue]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
$('#view').addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='composer'){userAct();pushAnswer($('#ans').value);render();$('#view').scrollTop=1e6;}
  const cf=e.target.dataset.cmform;
  if(cf){const inp=e.target.querySelector('input'),txt=inp.value.trim();if(!txt)return;S.feed.find(p=>p.id===+cf).comments.push(['我',txt]);render();const i=$('#cm'+cf);if(i)i.focus({preventScroll:true});}
});
$('#view').addEventListener('input',e=>{
  if(e.target.id==='certname'){S.name=e.target.value;$('#certnm').textContent=S.name;}
  if(e.target.id==='dtext')S.draft.text=e.target.value;
});
$('#view').addEventListener('change',e=>{
  if(e.target.id!=='photo')return;const f=e.target.files[0];if(!f)return;
  if(!f.type.startsWith('image/'))return toast('請選擇圖片檔。');
  const r=new FileReader();r.onload=()=>{S.draft.img=r.result;S.draft.pick=null;render();};r.readAsDataURL(f);
});
setInterval(()=>{
  if(S.tab!=='quest'||S.q.done.every(Boolean)||S.sheet)return;
  const s=Math.floor((Date.now()-S.q.start)/1000),t=$('#timer');if(t)t.textContent=fmt(s);
  if(s>=45&&!S.q.hintN){S.q.hintN=1;S.q.autoHint=true;render();}
  if(TOUR[step].live)paintCoach();
},1000);

goStep(0);
</script>
